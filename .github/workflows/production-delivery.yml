name: Production delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@48a4449de4ac5f4d5e14343f70fe5fc57bc2cd74
    with:
      sync_only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  migrate:
    name: Verify and apply pending Waxon migrations
    needs: deliver
    if: github.ref == 'refs/heads/main' && !inputs.stage_prebuilt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify this commit is still on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Check migration history and apply pending migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: node scripts/production-migrations.mjs

  publish:
    needs: [deliver, migrate]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.deliver.result == 'success' &&
      ((inputs.stage_prebuilt && needs.migrate.result == 'skipped') ||
       (!inputs.stage_prebuilt && needs.migrate.result == 'success'))
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@e11e1d0beb80276055c14630c2bc1e9515a94eaa
    with:
      project_id: prj_wfpyQUxJK3cZKK3UbRmqnCAKfGrs
      project_name: waxon
      production_domains: '["waxon.tsilva.eu","waxon-eight.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY","NEXT_PUBLIC_CLERK_SIGN_IN_URL","NEXT_PUBLIC_CLERK_SIGN_UP_URL","NEXT_PUBLIC_GOOGLE_ANALYTICS_ID","NEXT_PUBLIC_SENTRY_DSN","SENTRY_ORG","SENTRY_PROJECT"]'
      source_maps: true
      promote: ${{ !inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
