name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLICATION_CONTRACT_TEST_DATABASE_URL: postgresql://waxon:waxon@127.0.0.1:5432/waxon
      DATABASE_URL: postgresql://waxon:waxon@127.0.0.1:5432/waxon
      DATABASE_URL_UNPOOLED: postgresql://waxon:waxon@127.0.0.1:5432/waxon
      QUESTION_SEARCH_TEST_DATABASE_URL: postgresql://waxon:waxon@127.0.0.1:5432/waxon
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: waxon
          POSTGRES_PASSWORD: waxon
          POSTGRES_USER: waxon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waxon -d waxon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate dependency sources and audit
        run: pnpm security:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Install clean database baseline
        run: pnpm db:reset -- --confirm-clean-break

      - name: Test
        run: pnpm test

      - name: Verify schema declaration matches the clean baseline
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle-v2

      - name: Build hosted-mode production application
        run: pnpm build
        env:
          VERCEL_ENV: preview
